packages:
  - apps/*
  - packages/*
  - oxlint-plugin
  - scripts

catalog:
  "@effect/atom-react": 4.1.5
  "@effect/language-service": 0.87.5
  "@effect/platform-node": 4.1.5
  "@effect/tsgo": 0.73.4
  "@effect/vitest": 4.1.5
  "@types/node": 24.12.4
  effect: 4.1.5
  vite-plus: 1.8.0

overrides:
  # Tests run on Vite+'s bundled Vitest; see the @effect/vitest patch below.
  "@effect/vitest>vitest": "-"

# The patch makes @effect/vitest import vite-plus/test (same as T3 Code).
packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: 1.8.0

patchedDependencies:
  "@effect/vitest@4.1.5": patches/@effect__vitest@4.1.5.patch

# pnpm 12 links agent skills that dependencies ship into .claude/skills once
# approved. We keep our own instructions in AGENTS.md, so deny these.
permissions:
  expo-sqlite:
    skills: false
